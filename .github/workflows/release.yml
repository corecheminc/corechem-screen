# Builds the CoreChem Screen Windows installer and publishes it as a GitHub release of this repo, where the Hub's
# screen setup script downloads it from (…/releases/latest/download/CoreChemScreen-Setup.exe) and electron-updater
# looks for updates. The app holds no secrets, so repo and installer are public; the build needs nothing but the
# workflow's own GITHUB_TOKEN.
#
# Release: bump "version" in package.json, commit, push a tag  v<version>  (e.g. v0.1.0). A manual run builds without
# publishing and attaches the installer as a workflow artifact.
name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $t = "${{ github.ref_name }}".Substring(1)
          if ($v -ne $t) { throw "package.json version $v does not match tag $t" }
      # electron-builder uploads the installer, its blockmap and latest.yml in parallel and creates the release on
      # first contact — on 2026-11-09 that made TWO release objects for one tag (v0.1.0 and v0.1.1 each), one holding
      # only the blockmap and marked "latest", so …/releases/latest/download/ 404'd. Creating the release first means
      # electron-builder only ever uploads into it. It is created as a DRAFT: a draft is never "latest", so the
      # download URL keeps pointing at the previous whole release until this one is complete (the same night a
      # reinstall hit the few minutes between "release created" and "installer uploaded" and failed).
      - name: Create the release first, as a draft (one object per tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --notes "CoreChem Screen $tag" --draft }
      - name: Build installer (publish when tagged)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.ref }}".StartsWith('refs/tags/v')) { npx electron-builder --win --publish always }
          else { npx electron-builder --win --publish never }
      - name: Check the release is whole, then publish it as latest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $names = gh release view $tag --json assets --jq '.assets[].name'
          # web installer (since 0.1.8): the ~1 MB CoreChemScreen-Setup.exe fetches the app package (.nsis.7z) itself
          $v = (Get-Content package.json | ConvertFrom-Json).version
          foreach ($need in @('CoreChemScreen-Setup.exe', 'latest.yml', "corechem-screen-$v-x64.nsis.7z")) {
            if ($names -notcontains $need) { throw "release is missing $need (assets: $($names -join ', '))" }
          }
          gh release edit $tag --draft=false --latest
      - uses: actions/upload-artifact@v4
        with:
          name: CoreChemScreen-Setup
          path: |
            dist/nsis-web/*.exe
            dist/nsis-web/*.7z
            dist/nsis-web/latest.yml
          if-no-files-found: error
